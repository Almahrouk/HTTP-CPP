# =========================
# Global notes:
# - This config intentionally includes overlapping locations to test longest-prefix match.
# - Includes both "inherit server root" cases and "location root" override cases.
# - Includes directories with autoindex on/off and index present/absent cases.
# =========================

server {
    listen 8080;
    host 0.0.0.0;
    server_name localhost;

    # Base document root (most GETs should resolve under here)
    root ./var/www/;
    # index showcase.html;

    # Upload size test (POST bodies > 10M should fail)
    client_max_body_size 20M;

    # Custom error pages (relative paths resolved under server root in many implementations)
    error_page 400 error/400.html;
    error_page 403 error/403.html;
    error_page 404 error/404.html;
    error_page 405 error/405.html;
    error_page 413 error/413.html;
    error_page 500 error/500.html;
    error_page 502 error/502.html;
    error_page 503 error/503.html;

    # -------------------------
    # 1) Exact root location
    # -------------------------
    location / {
        methods GET;
        autoindex off;
        # index inherited from server if your code supports it
    }

    # -------------------------
    # 2) Autoindex directory listing under server root
    #    Tests: /web, /web/, /web/somefile
    # -------------------------
    location /web {
        methods GET;
		index showcase.html;
        autoindex on;
        # no location root: should inherit server root
        # expects ./var/www/web/web/ to exist for autoindex test
    }

    # -------------------------
    # 3) Overlapping locations (prefix match / specificity)
    #    Tests: /assets vs /assets/css
    # -------------------------
    location /assets {
        methods GET;
        autoindex on;
        # expects ./var/www/web/assets/
    }

    location /assets/css {
        methods GET;
        autoindex off;
        # expects ./var/www/web/assets/css/
    }

    # -------------------------
    # 4) Uploads (serving + storing)
    #    Tests:
    #      - GET  /uploads (directory)
    #      - POST /uploads/file
    #      - DELETE /uploads/file
    #
    # Two important edge-cases:
    #   A) upload_store points somewhere
    #   B) root may be inherited or explicitly set depending on your semantics
    # -------------------------
    location /uploads {
        methods GET POST DELETE;

        # If your project serves uploads from a different directory than server root,
        # set location root to match the served directory.
        root ./var/www/uploads;

        upload_store ./var/www/uploads;
        autoindex on;
        # expects ./var/www/uploads/ to exist and be readable
    }

    # -------------------------
    # 5) CGI (multiple extensions)
    #    Tests:
    #      - GET/POST /cgi/test.py
    #      - GET/POST /cgi/test.sh
    # -------------------------
    location /cgi {
        methods GET POST;
        root ./var/www/cgi/cgi-bin;
        cgi_extension .py /usr/bin/python3;
        cgi_extension .sh /bin/bash;
        autoindex off;
    }

    # -------------------------
    # 6) Redirect location
    #    Tests: GET /redirect
    # -------------------------
    location /redirect {
        return 301 http://localhost:4242/;
    }

    # -------------------------
    # 7) Method not allowed test area
    #    Tests:
    #      - POST /readonly -> should be rejected (405 in a strict implementation)
    # -------------------------
    location /readonly {
        methods GET;
        autoindex on;
        # expects ./var/www/web/readonly/
    }
}

# ==========================================================
# Second server to test:
# - different root/index
# - smaller max body
# - uploads with inherited root vs explicit root
# - different server_name
# ==========================================================
server {
    listen 4248;
    host 0.0.0.0;
    server_name webserv;

    root ./var/www/site2;
    index yaaqoub.html;

    client_max_body_size 5M;

    error_page 403 error/403.html;
    error_page 404 error/404.html;
    error_page 500 error/500.html;

    location / {
        methods GET;
        autoindex off;
    }

    # --------------------------------------------
    # Uploads edge-case variant:
    # If you want to test "inherit server root"
    # behavior, comment the location root here.
    # --------------------------------------------
    location /uploads {
        methods GET POST DELETE;

        # Variant 1 (explicit): serve uploads from separate dir:
        root ./var/www/uploads;
        upload_store ./var/www/uploads;

        # Variant 2 (inherited): serve under ./var/www/site2/uploads
        # (comment the two lines above and use this one instead)
        # upload_store ./var/www/site2/uploads;

        autoindex on;
    }

    location /cgi {
        methods GET POST;
        root ./var/www/cgi/cgi-bin;
        cgi_extension .py /usr/bin/python3;
        autoindex off;
    }
	location /sir_t9awd
	{
		return 301 https://www.youtube.com
	}

    # Redirect test to a subpath (trailing slash edge-case)
    location /go {
        return 301 http://localhost:8080/web/;
    }
}

