http {
    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen 0.0.0.0:8080;
        server_name localhost;
        root ./var/www/web;
        index showcase.html;
        client_max_body_size 10M;

        error_page 400 /error/400.html;
        error_page 403 /error/403.html;
        error_page 404 /error/404.html;
        error_page 500 /error/500.html;
        error_page 502 /error/502.html;
        error_page 503 /error/503.html;

        location / {
            autoindex off;
        }

        location /web {
            autoindex on;
        }

        location /uploads {
            root ./var/www/uploads;
            autoindex on;
        }

        location /cgi {
            root ./var/www/cgi/cgi-bin;
        }

        location /redirect {
            return 301 http://localhost:4242/;
        }
    }

    server {
        listen 0.0.0.0:4242;
        server_name webserv;
        root ./var/www/web;
        index yaaqoub.html;
        client_max_body_size 5M;

        error_page 403 /error/403.html;
        error_page 404 /error/404.html;
        error_page 500 /error/500.html;

        location / {
            autoindex off;
        }

        location /uploads {
            root ./var/www/uploads;
            autoindex on;
        }

        location /cgi {
            root ./var/www/cgi/cgi-bin;
        }
    }
}

events {}