<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        :root {
            --bg-1: #0f172a;
            --bg-2: #1e293b;
            --card: #111827;
            --text: #e5e7eb;
            --muted: #94a3b8;
            --accent: #f59e0b;
            --accent-2: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "Trebuchet MS", "Gill Sans", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 10% 20%, rgba(245, 158, 11, 0.18), transparent 35%),
                radial-gradient(circle at 90% 80%, rgba(239, 68, 68, 0.15), transparent 40%),
                linear-gradient(130deg, var(--bg-1), var(--bg-2));
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .card {
            width: min(720px, 100%);
            background: linear-gradient(180deg, rgba(17, 24, 39, 0.92), rgba(2, 6, 23, 0.92));
            border: 1px solid rgba(148, 163, 184, 0.25);
            border-radius: 18px;
            padding: 36px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
            animation: rise 450ms ease-out;
        }

        .code {
            font-size: clamp(58px, 14vw, 112px);
            line-height: 0.9;
            letter-spacing: 2px;
            font-weight: 800;
            color: var(--accent);
            text-shadow: 0 0 28px rgba(245, 158, 11, 0.35);
        }

        h1 {
            margin-top: 10px;
            font-size: clamp(24px, 4vw, 36px);
            line-height: 1.2;
        }

        p {
            margin-top: 14px;
            color: var(--muted);
            font-size: 18px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 26px;
        }

        .btn {
            text-decoration: none;
            border-radius: 10px;
            padding: 12px 18px;
            font-weight: 700;
            transition: transform 180ms ease, opacity 180ms ease, background 180ms ease;
        }

        .btn-primary {
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            color: #0b1020;
        }

        .btn-secondary {
            border: 1px solid rgba(148, 163, 184, 0.45);
            color: var(--text);
            background: rgba(148, 163, 184, 0.08);
        }

        .btn:hover {
            transform: translateY(-2px);
            opacity: 0.95;
        }



        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(12px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
    </style>
</head>

<body>
    <main class="card">
        <div class="code">404</div>
        <h1>Page not found</h1>
        <p>The resource you requested does not exist or has been moved.</p>
        <div class="actions">
            <a class="btn btn-primary" href="/">Go to Home</a>
        </div>

    </main>
</body>

</html>
